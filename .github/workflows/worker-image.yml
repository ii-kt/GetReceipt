name: Build receipt worker image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cloud/**"
      - "worker/**"
      - "scripts/verify_chrome_worker.py"
      - "tests/**"
      - ".dockerignore"
      - "deploy/compose.yaml"
      - "deploy/Caddyfile"
      - "deploy/host.env.example"
      - "deploy/worker.env.example"
      - ".github/workflows/worker-image.yml"
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - "worker/**"
      - "scripts/verify_chrome_worker.py"
      - "tests/**"
      - ".dockerignore"
      - "deploy/compose.yaml"
      - "deploy/Caddyfile"
      - "deploy/host.env.example"
      - "deploy/worker.env.example"
      - ".github/workflows/worker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: receipt-worker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            cloud/requirements.txt

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt pytest
          python -m pytest -q

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          cp deploy/worker.env.example deploy/worker.env
          trap 'rm -f deploy/worker.env' EXIT
          docker compose \
            --env-file deploy/host.env.example \
            --file deploy/compose.yaml \
            config --quiet
          docker run --rm \
            --env WORKER_DOMAIN=receipt-worker.example.com \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build Google Chrome worker for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: getreceipt-worker:smoke
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify sandboxed Google Chrome and persistent profile
        id: chrome_smoke
        shell: bash
        run: |
          chrome_smoke_json="$(docker run --rm --cap-drop ALL --shm-size=1g \
            getreceipt-worker:smoke \
            python /app/scripts/verify_chrome_worker.py)"
          printf '%s\n' "$chrome_smoke_json"
          printf 'json=%s\n' "$chrome_smoke_json" >> "$GITHUB_OUTPUT"

      - name: Publish tested Google Chrome worker
        if: github.ref == 'refs/heads/main'
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/getreceipt-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/getreceipt-worker:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record deployable image digest
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          CHROME_SMOKE_JSON: ${{ steps.chrome_smoke.outputs.json }}
        run: |
          {
            echo "### Receipt worker image"
            echo
            echo '```text'
            echo "ghcr.io/${{ github.repository_owner }}/getreceipt-worker@${{ steps.publish.outputs.digest }}"
            echo '```'
            echo
            echo "Chrome smoke: \`$CHROME_SMOKE_JSON\`"
          } >> "$GITHUB_STEP_SUMMARY"
