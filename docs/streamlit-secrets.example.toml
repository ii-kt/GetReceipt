[auth]
# Register this exact URI as a Microsoft Entra Web redirect URI.
redirect_uri = "https://get-receipt.streamlit.app/oauth2callback"
cookie_secret = "replace-with-a-strong-random-cookie-secret"

[auth.microsoft]
# Use the owner-login app registration. A separate Graph Mail.Read app is recommended.
client_id = "replace-with-microsoft-application-client-id"
client_secret = "replace-with-microsoft-client-secret"
server_metadata_url = "https://login.microsoftonline.com/consumers/v2.0/.well-known/openid-configuration"

[app_access]
mode = "oidc"
provider = "microsoft"
# First login: keep this non-matching placeholder. The locked page displays
# only your SHA-256 identity fingerprint; replace the placeholder with it.
allowed_identity_hashes = ["sha256:replace-after-first-owner-login"]

[receipt_worker]
base_url = "https://receipt-worker.example.com"
api_token = "same-value-as-GETRECEIPT_API_TOKEN"
owner_id = "same-value-as-GETRECEIPT_OWNER_ID"

[google_service_account]
type = "service_account"
project_id = "replace"
private_key_id = "replace"
private_key = "replace"
client_email = "replace"
client_id = "replace"
token_uri = "https://oauth2.googleapis.com/token"
