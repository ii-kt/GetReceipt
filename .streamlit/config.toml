[theme]
base = "light"
primaryColor = "#171914"
backgroundColor = "#f3f1eb"
secondaryBackgroundColor = "#fffefa"
textColor = "#171914"
font = "sans serif"
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
runOnSave = false
disconnectedSessionTTL = 600
